<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anubis OSS - Data Explorer</title>

    <!-- Perspective themes -->
    <link rel="stylesheet" crossorigin="anonymous"
        href="https://cdn.jsdelivr.net/npm/@finos/perspective-viewer@3.8.0/dist/css/themes.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: #6cb4ee; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header */
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .header h1 .accent { color: #6cb4ee; }

        .header-badge {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            padding: 3px 8px;
            border-radius: 4px;
            background: #1a1a2e;
            color: #8888cc;
        }

        .header-links {
            display: flex;
            gap: 16px;
            font-size: 0.82rem;
        }

        .header-links a { color: #666; }
        .header-links a:hover { color: #6cb4ee; }

        /* Status */
        .status-bar {
            padding: 10px 24px;
            font-size: 0.8rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1a1a1a;
        }

        .status-bar .count { color: #888; }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #444;
        }

        .status-dot.loaded { background: #4c8; }

        /* Loading state */
        .loading-overlay {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            color: #666;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #222;
            border-top-color: #6cb4ee;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cc4444;
            padding: 40px;
            text-align: center;
        }

        /* Perspective viewer */
        #viewer-container {
            flex: 1;
            position: relative;
            display: none;
        }

        .status-spacer { flex: 1 1 auto; }

        .view-hint {
            font-size: 0.72rem;
            color: #6a7078;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40ch;
        }

        .share-btn {
            background: none;
            border: 1px solid #243a50;
            border-radius: 5px;
            color: #9aa3ae;
            font-family: inherit;
            font-size: 0.74rem;
            padding: 4px 11px;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.15s, color 0.15s;
        }

        .share-btn:hover { border-color: #7cc0f0; color: #7cc0f0; }
        .share-btn[hidden] { display: none; }

        perspective-viewer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1><span class="accent">Anubis</span> Data Explorer</h1>
            <span class="header-badge">PERSPECTIVE</span>
        </div>
        <div class="header-links">
            <a href="leaderboard.html">&larr; Leaderboard</a>
            <a href="https://devpadapp.com/anubis-oss.html">Anubis OSS</a>
            <a href="https://github.com/uncSoft/anubis-oss">GitHub</a>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Loading data...</span>
        <span class="status-spacer"></span>
        <span class="view-hint" id="view-hint"></span>
        <button class="share-btn" id="share-btn" type="button" hidden
                title="Copy a link that reopens this exact pivot, filter and chart">Copy view link</button>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p>Loading benchmark data...</p>
    </div>

    <div class="error-state" id="error" style="display:none"></div>

    <div id="viewer-container">
        <perspective-viewer id="viewer" theme="Pro Dark"></perspective-viewer>
    </div>

    <script type="module">
        import perspective from "https://cdn.jsdelivr.net/npm/@finos/perspective@3.8.0/dist/cdn/perspective.js";
        import "https://cdn.jsdelivr.net/npm/@finos/perspective-viewer@3.8.0/dist/cdn/perspective-viewer.js";
        import "https://cdn.jsdelivr.net/npm/@finos/perspective-viewer-datagrid@3.8.0/dist/cdn/perspective-viewer-datagrid.js";
        import "https://cdn.jsdelivr.net/npm/@finos/perspective-viewer-d3fc@3.8.0/dist/cdn/perspective-viewer-d3fc.js";

        const loadingEl = document.getElementById("loading");
        const errorEl = document.getElementById("error");
        const containerEl = document.getElementById("viewer-container");
        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const shareBtn = document.getElementById("share-btn");
        const viewHint = document.getElementById("view-hint");

        try {
            // Relative first so the page works on any host serving the API,
            // absolute as a fallback so it also works from a local copy or a
            // mirror. The API sends Access-Control-Allow-Origin: *.
            const API_PATHS = [
                "/anubis/api/leaderboard.php?limit=10000",
                "https://devpadapp.com/anubis/api/leaderboard.php?limit=10000",
            ];
            let data = null, lastErr = null;
            for (const url of API_PATHS) {
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    data = await resp.json();
                    break;
                } catch (e) { lastErr = e; }
            }
            if (!data) throw lastErr || new Error("could not reach the leaderboard API");
            const entries = data.entries || [];

            if (entries.length === 0) {
                throw new Error("No benchmark data available yet.");
            }

            // Clean up data for Perspective — pick the most interesting columns
            // and ensure numeric types. "Tokens/sec" reflects output-only throughput
            // for submissions from app v3.1+ (reasoning-aware); older entries may
            // include thinking tokens. "Prefill tok/s" and "Reasoning tok/s" are
            // computed from raw counts and durations.
            const cleaned = entries.map(e => ({
                // Kept in the projection so it matches the CSV the API emits
                // (?format=csv). Not in the default column list below, so the
                // view you land on is unchanged; it is there when you want it.
                "Run ID":           num(e.id),
                "Name":             e.display_name || "Anonymous",
                "Model":            e.model_name || "",
                "Quantization":     e.model_quantization || "",
                "Format":           e.model_format || "",
                "Chip":             e.chip_name || "",
                "Mac":              e.chip_mac_model || "",
                "Memory (GB)":      num(e.chip_memory_gb),
                "GPU Cores":        num(e.chip_gpu_cores),
                "CPU Cores":        num(e.chip_core_count),
                "Bandwidth (GB/s)": num(e.chip_bandwidth_gbs),
                "Output tok/s":     num(e.tokens_per_second),
                "Prefill tok/s":    prefillTps(e),
                "Reasoning tok/s":  reasoningTps(e),
                "Reasoning Tokens": num(e.reasoning_tokens),
                "Reasoning Duration (s)": num(e.reasoning_duration),
                "TTFT (ms)":        e.time_to_first_token != null ? num(e.time_to_first_token * 1000) : null,
                "Avg Latency (ms)": num(e.avg_token_latency_ms),
                "Eval Duration (s)": num(e.eval_duration),
                "Total Duration (s)": num(e.total_duration),
                "Load Time (s)":    num(e.load_duration),
                "Prompt Tokens":    num(e.prompt_tokens),
                "Prompt Eval (s)":  num(e.prompt_eval_duration),
                "Completion Tokens": num(e.completion_tokens),
                "Total Tokens":     num(e.total_tokens),
                "Context Length":   num(e.context_length),
                "Avg GPU Power (W)": num(e.avg_gpu_power_watts),
                "Peak GPU Power (W)": num(e.peak_gpu_power_watts),
                "Avg System Power (W)": num(e.avg_system_power_watts),
                "Peak System Power (W)": num(e.peak_system_power_watts),
                "Watts/Token":      num(e.avg_watts_per_token),
                "Avg GPU Freq (MHz)": num(e.avg_gpu_frequency_mhz),
                "Peak GPU Freq (MHz)": num(e.peak_gpu_frequency_mhz),
                "Peak Memory (GB)": e.peak_memory_bytes != null ? round(e.peak_memory_bytes / 1073741824, 2) : null,
                "Backend":          e.backend || "",
                "App Version":      e.app_version || "",
                "Methodology":      num(e.methodology_version),
                // Run-group context (Anubis v3.5+ N-rep groups). When a
                // submission is one of N reps, group_* fields carry the
                // aggregate (mean + 95% bootstrap CI) for the headline
                // metrics. Per-rep rows still show their own tok/s in
                // "Output tok/s" — these columns let you see the group's
                // spread alongside.
                "Group Reps":       num(e.group_sample_count),
                "Group Rep #":      num(e.group_repetition_index),
                "Group Mean tok/s": num(e.group_mean_tokens_per_second),
                "Group ±CI tok/s": ciHalfWidth(e.group_ci_low_tokens_per_second, e.group_ci_high_tokens_per_second),
                "Group Mean TTFT (ms)": e.group_mean_time_to_first_token != null ? num(e.group_mean_time_to_first_token * 1000) : null,
                "Group Mean J/Tok": num(e.group_mean_watts_per_token),
                "Seed Strategy":    e.group_seed_strategy || "",
                "Submitted":        e.submitted_at || "",
            }));

            // Initialize Perspective
            const worker = await perspective.worker();
            const table = await worker.table(cleaned);

            // Show viewer
            loadingEl.style.display = "none";
            containerEl.style.display = "block";

            const viewer = document.getElementById("viewer");
            await viewer.load(table);

            const DEFAULT_VIEW = {
                plugin: "Datagrid",
                theme: "Pro Dark",
                columns: [
                    "Name", "Model", "Quantization", "Format", "Chip", "Memory (GB)",
                    "Output tok/s", "Group Mean tok/s", "Group ±CI tok/s", "Group Reps",
                    "Prefill tok/s", "Reasoning tok/s",
                    "TTFT (ms)", "Watts/Token",
                    "Avg GPU Power (W)", "Peak Memory (GB)", "Backend", "Methodology"
                ],
                sort: [["Output tok/s", "desc"]],
                settings: true,
            };

            // A shared link carries the whole analysis: pivots, aggregates,
            // filters, computed expressions, chart type. Perspective's own
            // save()/restore() pair is the entire mechanism - we only move the
            // config in and out of the URL.
            const shared = readViewFromHash();
            await viewer.restore(shared || DEFAULT_VIEW);

            // Update status
            statusDot.classList.add("loaded");
            statusText.textContent = `${entries.length} benchmark entries loaded`;
            shareBtn.hidden = false;
            if (shared) describeView(shared, true);

            // Keep the URL in step with the view, without spamming history.
            let writeTimer = null;
            viewer.addEventListener("perspective-config-update", () => {
                clearTimeout(writeTimer);
                writeTimer = setTimeout(async () => {
                    const cfg = await viewer.save();
                    writeViewToHash(cfg);
                    describeView(cfg, false);
                }, 250);
            });

            window.addEventListener("hashchange", async () => {
                if (location.hash === lastWrittenHash) return;
                const next = readViewFromHash();
                if (!next) return;
                await viewer.restore(next);
                describeView(next, true);
            });

            shareBtn.addEventListener("click", async () => {
                const cfg = await viewer.save();
                writeViewToHash(cfg);
                const url = location.href;
                const done = () => {
                    shareBtn.textContent = "Link copied";
                    setTimeout(() => { shareBtn.textContent = "Copy view link"; }, 1800);
                };
                try {
                    await navigator.clipboard.writeText(url);
                    done();
                } catch (e) {
                    // Insecure context or permission refused: fall back, then
                    // give up gracefully rather than pretending it worked.
                    const ta = document.createElement("textarea");
                    ta.value = url;
                    ta.style.position = "fixed";
                    ta.style.top = "-1000px";
                    document.body.appendChild(ta);
                    ta.select();
                    let ok = false;
                    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
                    document.body.removeChild(ta);
                    if (ok) { done(); }
                    else {
                        shareBtn.textContent = "Copy from the address bar";
                        setTimeout(() => { shareBtn.textContent = "Copy view link"; }, 2600);
                    }
                }
            });

        } catch (err) {
            loadingEl.style.display = "none";
            errorEl.style.display = "flex";
            errorEl.textContent = `Failed to load: ${err.message}`;
            statusText.textContent = "Error loading data";
        }

        // ── Shareable view state ──────────────────────────────────────
        // The config is JSON with non-ASCII column names ("Group ±CI tok/s"),
        // so encode UTF-8 explicitly rather than relying on btoa's latin1.
        // base64url keeps the fragment clean if anyone rewrites it as a query.
        function toB64Url(str) {
            const bytes = new TextEncoder().encode(str);
            let bin = "";
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        function fromB64Url(s) {
            s = s.replace(/-/g, "+").replace(/_/g, "/");
            while (s.length % 4) s += "=";
            const bin = atob(s);
            const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function readViewFromHash() {
            const m = location.hash.match(/(?:^#|&)v=([A-Za-z0-9\-_]+)/);
            if (!m) return null;
            try {
                const cfg = JSON.parse(fromB64Url(m[1]));
                return (cfg && typeof cfg === "object") ? cfg : null;
            } catch (e) {
                // A truncated or hand-edited link should open the default view,
                // not a broken page.
                return null;
            }
        }

        let lastWrittenHash = null;

        function writeViewToHash(cfg) {
            try {
                const hash = "#v=" + toB64Url(JSON.stringify(cfg));
                if (hash !== location.hash) {
                    lastWrittenHash = hash;
                    history.replaceState(null, "", location.pathname + location.search + hash);
                }
            } catch (e) { /* a URL we cannot write is not worth failing over */ }
        }

        // Say in words what the link will reopen, so it is obvious the button
        // shares an analysis and not just the page.
        function describeView(cfg, restored) {
            const bits = [];
            if (cfg.group_by && cfg.group_by.length) bits.push("by " + cfg.group_by.join(" / "));
            if (cfg.split_by && cfg.split_by.length) bits.push("split by " + cfg.split_by.join(" / "));
            if (cfg.filter && cfg.filter.length) bits.push(cfg.filter.length + " filter" + (cfg.filter.length > 1 ? "s" : ""));
            if (cfg.expressions && Object.keys(cfg.expressions).length) bits.push("computed columns");
            if (cfg.plugin && cfg.plugin !== "Datagrid") bits.push(cfg.plugin.toLowerCase());
            const what = bits.length ? bits.join(" · ") : "";
            viewHint.textContent = restored
                ? (what ? "shared view: " + what : "shared view")
                : what;
        }

        function num(v) {
            if (v == null) return null;
            const n = Number(v);
            return isNaN(n) ? null : n;
        }

        function round(v, d) {
            if (v == null) return null;
            const f = Math.pow(10, d);
            return Math.round(v * f) / f;
        }

        function prefillTps(e) {
            const t = num(e.prompt_tokens);
            const d = num(e.prompt_eval_duration);
            if (t == null || d == null || d <= 0) return null;
            return t / d;
        }

        function reasoningTps(e) {
            const t = num(e.reasoning_tokens);
            const d = num(e.reasoning_duration);
            if (t == null || d == null || d <= 0) return null;
            return t / d;
        }

        // Half-width of a 95% CI — what people usually want to see after
        // a ± sign. Returns null when either bound is missing.
        function ciHalfWidth(low, high) {
            const l = num(low), h = num(high);
            if (l == null || h == null) return null;
            return round((h - l) / 2, 3);
        }
    </script>
</body>
</html>
